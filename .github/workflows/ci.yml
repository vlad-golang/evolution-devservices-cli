name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: vet
        run: make vet

      - name: test
        run: make test

      - name: build
        run: make build

      - name: build-all (cross-compile matrix)
        run: make build-all
